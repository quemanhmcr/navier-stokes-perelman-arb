name: Affine Escape identities — Exact + Arb 160-bit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-affine-escape.yml'
      - 'experiments/verify_affine_escape.py'
      - 'README.md'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact + Arb stack
        run: python -m pip install --upgrade pip 'python-flint==0.9.0' 'sympy==1.14.0'
      - name: Run Affine Escape verification at Arb 160 bits
        run: |
          set -o pipefail
          python experiments/verify_affine_escape.py | tee affine-escape-log.txt
      - name: Publish summary
        if: always()
        run: |
          if [ -f affine-escape-summary.md ]; then cat affine-escape-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: affine-escape-arb-160
          path: |
            affine-escape-log.txt
            affine-escape-results.json
            affine-escape-summary.md
