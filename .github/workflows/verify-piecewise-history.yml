name: Time-ordered deformation histories — Arb 160-bit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-piecewise-history.yml'
      - 'experiments/verify_piecewise_history.py'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip 'python-flint==0.9.0'
      - name: Run rigorous time-ordered history checks
        run: |
          set -o pipefail
          python experiments/verify_piecewise_history.py | tee piecewise-history-log.txt
      - name: Publish summary
        if: always()
        run: test ! -f piecewise-history-summary.md || cat piecewise-history-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: piecewise-history-arb-160
          path: |
            piecewise-history-log.txt
            piecewise-history-results.json
            piecewise-history-summary.md
